name: Build Android

on:
  push:
    paths-ignore:
      - '.github/workflows/**'
      - '**.md'
      - 'docs/**'
    branches: [ master ]
  workflow_dispatch:
    inputs:
      java_version:
        description: 'Java version'
        required: true
        default: '17'
      java_distribution:
        description: 'Java distribution'
        required: true
        default: 'temurin'
      verbose:
        description: 'Run with verbose logging'
        required: false
        default: 'false'
      build_appbundle:
        description: 'Also build the Play Store AppBundle (.aab)'
        type: boolean
        required: false
        default: false

env:
  KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
  ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
  ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
  CHAT_ID: ${{ secrets.CHAT_ID }}
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  VERBOSE: ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}
  APK_DIR: build/app/outputs/apk/release
  # org.gradle.caching is unset in android/gradle.properties, so build-cache-1
  # was never written and every run recompiled Kotlin, reran R8 and remerged
  # resources. Set here rather than in gradle.properties to keep it in a
  # fork-owned file that upstream syncs will not touch.
  GRADLE_OPTS: -Dorg.gradle.caching=true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: ${{ github.event.inputs.java_distribution || 'temurin' }}
        java-version: ${{ github.event.inputs.java_version || '17' }}

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    # cargokit builds rhttp with --target-dir <plugin buildDir>/build, which
    # resolves to build/rhttp/build. Without pointing the cache at it, the
    # default workspace (repo root, no Cargo.toml) caches nothing and every run
    # recompiles the whole dependency tree once per Android ABI.
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        cache-workspaces: |
          plugins/rhttp/rhttp/rust -> ../../../../build/rhttp/build

    # actions/cache with a hashFiles key only writes when the key is new, so the
    # build-cache-1 entries produced under org.gradle.caching were discarded at
    # the end of every job. setup-gradle uses a rolling key, so an accumulating
    # cache actually persists, and it caches selectively instead of storing all
    # of ~/.gradle/caches, which had grown to 4.5 GB of mostly dependency jars
    # and AGP transforms.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false
        cache-cleanup: on-success

    - name: Flutter Doctor
      if: github.event.inputs.verbose == 'true'
      run: flutter doctor -v

    - name: Flutter Pub Get (rhttp)
      working-directory: plugins/rhttp/rhttp
      run: flutter pub get

    - name: Flutter Build Runner (rhttp)
      working-directory: plugins/rhttp/rhttp
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Flutter Pub Get
      run: flutter pub get

    - name: Flutter Build Runner
      run: flutter packages pub run build_runner build --delete-conflicting-outputs

    - name: Flutter Test
      continue-on-error: true
      run: flutter test $VERBOSE

    # One assemble emits the per-ABI APKs plus app-universal-release.apk, which
    # is the fat APK. Building them separately costs a second full AOT compile.
    - name: Flutter Build APKs
      run: flutter build apk --split-per-abi $VERBOSE --dart-define=IS_GOOGLEPLAY=false --dart-define=BUILD_ABI=true

    # Confirms the build cache was actually switched on before any timing from
    # this run gets interpreted. An empty build-cache-1 means GRADLE_OPTS did
    # not reach the daemon and the result says nothing about caching.
    - name: Verify Gradle Build Cache Is Active
      run: |
        d=~/.gradle/caches/build-cache-1
        if [ -d "$d" ]; then
          echo "entries: $(find "$d" -type f | wc -l), size: $(du -sh "$d" | cut -f1)"
        else
          echo "::warning::build-cache-1 absent - org.gradle.caching did not take effect"
        fi

    - name: Verify APK Outputs
      run: |
        ls -lh "$APK_DIR"
        for apk in app-universal-release.apk app-arm64-v8a-release.apk; do
          test -s "$APK_DIR/$apk" || { echo "::error::missing or empty $apk"; exit 1; }
        done

    - name: Send APKs to me via Telegram
      if: env.CHAT_ID != '' && env.BOT_TOKEN != ''
      run: |
        send() {
          curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" -X POST \
            -F chat_id="$CHAT_ID" -F caption="[$2] $GITHUB_SHA" -F document="@$APK_DIR/$1" > /dev/null
        }
        send app-universal-release.apk "Fat APK"
        send app-arm64-v8a-release.apk "arm64-v8a"

    - name: Upload Fat APK
      uses: actions/upload-artifact@v4
      with:
        name: app-universal-release
        path: ${{ env.APK_DIR }}/app-universal-release.apk
        if-no-files-found: error

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v4
      with:
        name: app-arm64-v8a-release
        path: ${{ env.APK_DIR }}/app-arm64-v8a-release.apk
        if-no-files-found: error

    - name: Upload All APK Variants
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: ${{ env.APK_DIR }}/*.apk
        if-no-files-found: error

    # Play Store distribution only; not built on push. Runs off the warm Gradle
    # and AOT state left by the APK build, so it is cheap to tack on here.
    - name: Flutter Build AppBundle
      if: github.event.inputs.build_appbundle == 'true'
      run: flutter build appbundle $VERBOSE --dart-define=IS_GOOGLEPLAY=false --dart-define=BUILD_ABI=false

    - name: Upload AppBundle
      if: github.event.inputs.build_appbundle == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: build/app/outputs/bundle/release/*.aab
        if-no-files-found: error
